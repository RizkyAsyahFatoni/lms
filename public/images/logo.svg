<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" fill="none" class="w-full h-auto">
  <defs>
    <linearGradient id="oneGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="50%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0d9488" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Logo Mark (Emblem) -->
  <g filter="url(#glow)">
    <!-- Base Rounded Squircle -->
    <rect x="4" y="6" width="48" height="48" rx="14" fill="url(#oneGradient)" />
    
    <!-- Stylized Numeric "1" + Ascending Growth Wing -->
    <path d="M22 23L27 18H31V42H25V24.5L22 26V23Z" fill="#FFFFFF" />
    
    <!-- Dynamic Forward Spark/Arc representing Knowledge Continuity -->
    <path d="M35 22C38.5 24 41 27.5 41 32C41 36.5 38.5 40 35 42" stroke="#CCFBF1" stroke-width="3" stroke-linecap="round" />
    <circle cx="39" cy="22" r="2.5" fill="#38BDF8" />
  </g>

  <!-- Brand Typography -->
  <text x="62" y="34" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="21" fill="#0f172a" letter-spacing="-0.5">ONE</text>
  <text x="110" y="34" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="21" fill="#0d9488" letter-spacing="-0.3">LEARNING</text>

  <!-- Subtitle Tagline Badge -->
  <rect x="63" y="40" width="145" height="12" rx="3" fill="#f1f5f9" />
  <text x="66" y="49" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="7.5" fill="#64748b" letter-spacing="0.4">DIGITAL LEARNING ECOSYSTEM</text>
</svg>
